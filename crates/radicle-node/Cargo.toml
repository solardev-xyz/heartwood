[package]
name = "radicle-node"
version = "0.21.1"
description = "The Radicle Node"

build = "build.rs"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["backtrace", "i2p", "systemd", "structured-logger", "socket2", "tor"]
## Decline to serve inbound fetches instead of spawning `git upload-pack`.
## For embedded hosts that cannot spawn child processes (e.g. iOS).
no-serve = []
## Skip `git gc` storage maintenance (no child processes).
no-gc = []
## Serve inbound fetches in-process (libgit2 object access + a hand-written
## non-delta packfile) instead of spawning `git upload-pack`. Lets no-spawn
## hosts (e.g. iOS) publish. Takes precedence over the spawned path, but is
## still overridden by `no-serve`.
serve-in-process = ["dep:git2", "dep:flate2", "dep:sha1"]
dhat-heap = ["dep:dhat"]
i2p = ["cyphernet/i2p", "radicle/i2p", "radicle-protocol/i2p"]
systemd = ["dep:radicle-systemd"]
test = ["radicle/test", "radicle-crypto/test", "radicle-crypto/cyphernet", "radicle-protocol/test", "qcheck", "snapbox"]
tor = ["cyphernet/tor", "radicle/tor", "radicle-protocol/tor"]

[dependencies]
backtrace = { workspace = true, optional = true }
bytes = { workspace = true }
crossbeam-channel = "0.5.6"
cyphernet = { workspace = true, features = ["dns", "ed25519", "p2p-ed25519", "noise-framework", "noise_sha2"] }
dhat = { version = "0.3.3", optional = true }
fastrand = { workspace = true }
flate2 = { version = "1", optional = true }
getrandom = { workspace = true, features = ["std"] }
git2 = { workspace = true, optional = true }
gix-packetline = { workspace = true, features = ["blocking-io"] }
# The password of each remote node's SOCKS5 credentials.
hmac = "0.12.1"
indexmap = { workspace = true }
lexopt = { workspace = true }
log = { workspace = true, features = ["kv", "std"] }
mio = { version = "1", features = ["net", "os-poll"] }
qcheck = { workspace = true, optional = true }
radicle = { workspace = true }
radicle-fetch = { workspace = true }
radicle-localtime = { workspace = true }
radicle-protocol = { workspace = true }
radicle-signals = { workspace = true }
radicle-log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10.9"
snapbox = { workspace = true, optional = true }
socket2 = { version = "0.5.7", features = ["all"], optional = true }
structured-logger = { version = "1.0.4", optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true, default-features = true }

[target.'cfg(target_os = "linux")'.dependencies]
radicle-systemd = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# The control socket, bound and made owner-only before it listens.
rustix = { version = "1.1", features = ["event", "fs", "net", "process"] }

[target.'cfg(windows)'.dependencies]
radicle-windows = { workspace = true }
uds_windows = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
mio = { version = "1", features = ["os-ext"] }
qcheck = { workspace = true }
radicle = { workspace = true, features = ["test"] }
radicle-log = { workspace = true, features = ["test"] }
radicle-protocol = { workspace = true, features = ["test"] }
radicle-crypto = { workspace = true, features = ["test", "cyphernet"] }
snapbox = { workspace = true }
# To damage a policy database behind a node's back, in the fatal-error tests.
sqlite = { workspace = true, features = ["bundled"] }
test-log = "0.2.19"
